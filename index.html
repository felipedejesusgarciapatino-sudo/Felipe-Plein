<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoramAi</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        /* Fondo con x1.jpg */
        background: url('x1.jpg') no-repeat center center fixed;
        background-size: cover;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    /* Título Hero SVG/PNG renderizado en vivo */
    .hero-titulo {
        max-width: min(85vw, 420px);
        height: auto;
        margin: 10px 0 10px;
        display: block;
        cursor: pointer;
        /* Transiciones suaves para tamaño y brillo */
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                    filter 0.3s ease-in-out;
        filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.8));
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    /* EFECTO: Destello y Agrandamiento al pasar el mouse o presionar en celular */
    .hero-titulo:hover,
    .hero-titulo:active {
        transform: scale(1.08);
        filter: drop-shadow(0px 0px 20px rgba(255, 255, 255, 0.9)) 
                drop-shadow(0px 0px 35px rgba(255, 255, 255, 0.6)) 
                brightness(1.25);
    }

    #mensaje {
        margin: 5px 0 15px;
        font-size: 16px;
        min-height: 22px;
        color: #eee;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    button {
        border: none;
        background: #e0e0e0;
        color: #111;
        padding: 10px 22px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 20px;
        transition: background 0.2s, transform 0.1s;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    button:hover {
        background: #fff;
    }

    button:active {
        transform: scale(0.97);
    }

    /* Tablero para 32 cartas: 8 columnas x 4 filas */
    #tablero {
        width: min(95vw, 900px);
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
        perspective: 1000px;
    }

    .carta {
        aspect-ratio: 1 / 1;
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.4s ease-in-out;
    }

    .carta.volteada {
        transform: rotateY(180deg);
    }

    .carta.bloqueada {
        cursor: default;
    }

    .cara {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 6px;
        overflow: hidden;
        backface-visibility: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .cara img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }

    .reverso {
        transform: rotateY(0deg);
    }

    .frente {
        transform: rotateY(180deg);
    }

    .pareja {
        box-shadow: 0 0 12px #00ff66;
    }

    /* Adaptación a celulares: 4 columnas x 8 filas */
    @media (max-width: 650px) {
        body {
            padding: 10px 5px;
        }

        .hero-titulo {
            max-width: 75vw;
        }

        #tablero {
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 98vw;
        }

        .cara {
            border-radius: 4px;
        }
    }
</style>
</head>

<body>

<!-- Título Hero embebido como Data URI con tipografía y diseño impactante -->
<img 
    src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 100' width='500' height='100'><style>text { font-family: Impact, Arial Black, sans-serif; font-size: 68px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }</style><text x='50%' y='70%' text-anchor='middle' fill='%23ffffff' stroke='%23000000' stroke-width='4' stroke-linejoin='miter'>MemoramAi</text></svg>" 
    alt="MemoramAi" 
    class="hero-titulo"
>

<div id="mensaje">Encuentra todas las parejas (0 / 16)</div>
<button onclick="reiniciarJuego()">Reiniciar juego</button>

<div id="tablero"></div>

<script>
const parejasTotales = 16;
let cartas = [];
let primeraCarta = null;
let segundaCarta = null;
let bloqueo = false;
let parejasEncontradas = 0;

function crearCartas() {
    cartas = [];
    for (let i = 1; i <= parejasTotales; i++) {
        cartas.push(i);
        cartas.push(i);
    }
}

function mezclar(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function crearTablero() {
    const tablero = document.getElementById("tablero");
    tablero.innerHTML = "";
    mezclar(cartas);

    cartas.forEach((numero) => {
        const carta = document.createElement("div");
        carta.classList.add("carta");

        // Reverso (a0.jpg)
        const reverso = document.createElement("div");
        reverso.classList.add("cara", "reverso");
        const imagenReverso = document.createElement("img");
        imagenReverso.src = "a0.jpg";
        imagenReverso.alt = "Reverso";
        reverso.appendChild(imagenReverso);

        // Frente (a1.jpg a a16.jpg)
        const frente = document.createElement("div");
        frente.classList.add("cara", "frente");
        const imagenFrente = document.createElement("img");
        imagenFrente.src = "a" + numero + ".jpg";
        imagenFrente.alt = "Carta " + numero;
        frente.appendChild(imagenFrente);

        carta.dataset.valor = numero;
        carta.appendChild(reverso);
        carta.appendChild(frente);

        carta.addEventListener("click", () => voltearCarta(carta));
        tablero.appendChild(carta);
    });
}

function voltearCarta(carta) {
    if (bloqueo) return;
    if (carta.classList.contains("volteada") || carta.classList.contains("pareja")) return;

    carta.classList.add("volteada");

    if (!primeraCarta) {
        primeraCarta = carta;
        return;
    }

    segundaCarta = carta;
    comprobarPareja();
}

function comprobarPareja() {
    const valor1 = primeraCarta.dataset.valor;
    const valor2 = segundaCarta.dataset.valor;

    if (valor1 === valor2) {
        primeraCarta.classList.add("pareja", "bloqueada");
        segundaCarta.classList.add("pareja", "bloqueada");
        parejasEncontradas++;

        document.getElementById("mensaje").textContent = 
            `Parejas encontradas: ${parejasEncontradas} / ${parejasTotales}`;

        primeraCarta = null;
        segundaCarta = null;

        if (parejasEncontradas === parejasTotales) {
            document.getElementById("mensaje").textContent = "🎉 ¡Felicidades! Encontraste todas las parejas.";
        }
    } else {
        bloqueo = true;
        setTimeout(() => {
            primeraCarta.classList.remove("volteada");
            segundaCarta.classList.remove("volteada");
            primeraCarta = null;
            segundaCarta = null;
            bloqueo = false;
        }, 900);
    }
}

function reiniciarJuego() {
    primeraCarta = null;
    segundaCarta = null;
    bloqueo = false;
    parejasEncontradas = 0;
    document.getElementById("mensaje").textContent = "Encuentra todas las parejas (0 / 16)";
    crearCartas();
    crearTablero();
}

reiniciarJuego();
</script>

</body>
</html>
