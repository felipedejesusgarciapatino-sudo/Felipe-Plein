<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #ffffff;
      color: #111111;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .usuario {
      align-self: flex-end;
      background: #eeeeee;
    }

    .ia {
      align-self: flex-start;
      background: #f7f7f7;
    }

    #barra {
      display: flex;
      padding: 12px;
      border-top: 1px solid #dddddd;
      background: #ffffff;
    }

    #entrada {
      flex: 1;
      resize: none;
      height: 44px;
      border: 1px solid #cccccc;
      border-radius: 12px;
      padding: 11px 14px;
      outline: none;
      font: inherit;
    }

    #entrada:focus {
      border-color: #999999;
    }

    #enviar {
      margin-left: 8px;
      width: 70px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: white;
      cursor: pointer;
    }

    #enviar:hover {
      background: #333333;
    }

    #enviar:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>

  <main id="chat"></main>

  <form id="barra">
    <textarea
      id="entrada"
      placeholder="Escribe un mensaje..."
      autocomplete="off"
      spellcheck="true"
    ></textarea>

    <button id="enviar" type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const barra = document.getElementById("barra");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");

    function agregarMensaje(texto, clase) {
      const mensaje = document.createElement("div");
      mensaje.className = `mensaje ${clase}`;
      mensaje.textContent = texto;
      chat.appendChild(mensaje);
      chat.scrollTop = chat.scrollHeight;
      return mensaje;
    }

    barra.addEventListener("submit", async (event) => {
      event.preventDefault();

      const texto = entrada.value.trim();

      if (!texto || enviar.disabled) return;

      agregarMensaje(texto, "usuario");

      entrada.value = "";
      enviar.disabled = true;

      const indicador = agregarMensaje("...", "ia");

      try {
        const respuesta = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: texto
          })
        });

        if (!respuesta.ok) {
          throw new Error("Error del servidor");
        }

        const datos = await respuesta.json();

        indicador.textContent = datos.reply || "Sin respuesta.";
      } catch (error) {
        indicador.textContent = "No se pudo obtener una respuesta.";
        console.error(error);
      } finally {
        enviar.disabled = false;
        entrada.focus();
      }
    });

    entrada.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        barra.requestSubmit();
      }
    });

    entrada.focus();
  </script>

</body>
</html>
