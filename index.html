<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouija</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #342719 0%, #17100a 55%, #080604 100%);
  color: #e8d7ad;
  font-family: Georgia, "Times New Roman", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* TÍTULO */

h1 {
  margin: 18px 0 4px;
  font-size: 28px;
  letter-spacing: 5px;
  text-align: center;
  text-shadow:
    0 0 8px #c59b52,
    0 0 20px #704d1d;
}

.subtitulo {
  margin-bottom: 15px;
  color: #a99168;
  font-size: 14px;
  text-align: center;
}

/* TABLERO */

#tablero {
  position: relative;
  width: min(94vw, 850px);
  aspect-ratio: 1.45 / 1;

  background:
    radial-gradient(
      ellipse at center,
      #80613a 0%,
      #604725 55%,
      #3a2816 100%
    );

  border: 12px solid #21160c;
  border-radius: 25px;

  box-shadow:
    0 0 0 3px #76552d,
    0 0 35px rgba(0,0,0,.8),
    inset 0 0 50px rgba(0,0,0,.6);

  overflow: hidden;
}

/* TEXTURA */

#tablero::before {
  content: "";
  position: absolute;
  inset: 0;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      rgba(255,255,255,.025) 2px,
      transparent 4px
    );

  pointer-events: none;
}

/* TEXTO DEL TABLERO */

.texto {
  position: absolute;
  width: 100%;
  text-align: center;

  color: #e5d0a1;

  text-shadow:
    1px 1px 2px #24170b,
    0 0 5px rgba(0,0,0,.5);
}

.si {
  top: 6%;
  left: 25%;
  width: 50%;
  font-size: clamp(25px, 5vw, 45px);
}

.no {
  top: 6%;
  right: 6%;
  width: 18%;
  font-size: clamp(25px, 5vw, 45px);
}

.hola {
  top: 22%;
  left: 0;
  font-size: clamp(15px, 2.5vw, 25px);
  letter-spacing: 5px;
}

.adios {
  bottom: 6%;
  left: 0;
  font-size: clamp(20px, 4vw, 38px);
  letter-spacing: 4px;
}

/* LETRAS */

.letras {
  position: absolute;

  left: 8%;
  right: 8%;
  top: 35%;

  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;

  text-align: center;
}

.letra {
  font-size: clamp(19px, 3.5vw, 35px);
  padding: 5px;

  color: #e6d1a4;

  text-shadow:
    1px 1px 2px #201409;
}

/* NÚMEROS */

.numeros {
  position: absolute;

  left: 20%;
  right: 20%;
  bottom: 20%;

  display: grid;
  grid-template-columns: repeat(5, 1fr);

  text-align: center;
}

.numero {
  font-size: clamp(18px, 3vw, 30px);
}

/* SÍMBOLO CENTRAL */

.simbolo {
  position: absolute;

  left: 50%;
  top: 51%;

  transform: translate(-50%, -50%);

  font-size: clamp(35px, 7vw, 70px);

  color: #d7bd82;

  opacity: .8;

  text-shadow:
    0 0 10px #d0a95d,
    0 0 25px rgba(0,0,0,.8);
}

/* PLANCHETTE */

#planchette {
  position: absolute;

  width: 95px;
  height: 115px;

  background:
    radial-gradient(
      circle at 40% 30%,
      #d8c18e,
      #8d7040 70%,
      #55401f
    );

  clip-path: polygon(
    50% 0%,
    100% 75%,
    50% 100%,
    0% 75%
  );

  border: 3px solid #3b2915;

  box-shadow:
    0 0 15px rgba(0,0,0,.8);

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  transition:
    left 1.1s ease-in-out,
    top 1.1s ease-in-out;

  z-index: 5;
}

#planchette::after {
  content: "";

  position: absolute;

  width: 28px;
  height: 28px;

  border-radius: 50%;

  background: rgba(35,20,10,.75);

  left: 50%;
  top: 43%;

  transform: translate(-50%, -50%);
}

/* CONTROLES */

#controles {
  width: min(94vw, 850px);

  margin-top: 15px;

  display: flex;
  gap: 8px;
}

#pregunta {
  flex: 1;

  height: 48px;

  border: 1px solid #80643b;
  border-radius: 10px;

  background: #17100a;
  color: #eee0bd;

  padding: 0 15px;

  font-family: inherit;
  font-size: 16px;

  outline: none;
}

#pregunta::placeholder {
  color: #8f7a59;
}

#pregunta:focus {
  border-color: #c4a568;
}

button {
  border: 1px solid #9b7940;
  border-radius: 10px;

  padding: 0 20px;

  background: #382615;
  color: #e8d5ac;

  font-family: inherit;
  font-size: 15px;

  cursor: pointer;
}

button:hover {
  background: #52391e;
}

button:disabled {
  opacity: .5;
}

/* RESPUESTA */

#respuesta {
  min-height: 55px;

  width: min(94vw, 850px);

  margin: 12px 0 20px;

  padding: 15px;

  text-align: center;

  border: 1px solid #5e4727;
  border-radius: 10px;

  background: rgba(12,8,4,.7);

  color: #e8d4a8;

  font-size: 18px;

  opacity: 0;

  transition: opacity .5s;
}

#respuesta.visible {
  opacity: 1;
}

@media (max-width: 600px) {

  #tablero {
    border-width: 7px;
  }

  #planchette {
    width: 65px;
    height: 78px;
  }

  #controles {
    flex-direction: column;
  }

  button {
    height: 45px;
  }
}
</style>
</head>

<body>

<h1>☽ OUIJA ☾</h1>

<div class="subtitulo">
  Haz una pregunta y mueve la planchette
</div>

<div id="tablero">

  <div class="texto si">SÍ</div>

  <div class="texto no">NO</div>

  <div class="texto hola">
    HOLA
  </div>

  <div class="texto adios">
    ADIÓS
  </div>

  <div class="letras">
    <div class="letra">A</div>
    <div class="letra">B</div>
    <div class="letra">C</div>
    <div class="letra">D</div>
    <div class="letra">E</div>
    <div class="letra">F</div>
    <div class="letra">G</div>

    <div class="letra">H</div>
    <div class="letra">I</div>
    <div class="letra">J</div>
    <div class="letra">K</div>
    <div class="letra">L</div>
    <div class="letra">M</div>
    <div class="letra">N</div>

    <div class="letra">O</div>
    <div class="letra">P</div>
    <div class="letra">Q</div>
    <div class="letra">R</div>
    <div class="letra">S</div>
    <div class="letra">T</div>
    <div class="letra">U</div>

    <div class="letra">V</div>
    <div class="letra">W</div>
    <div class="letra">X</div>
    <div class="letra">Y</div>
    <div class="letra">Z</div>
  </div>

  <div class="numeros">
    <div class="numero">1</div>
    <div class="numero">2</div>
    <div class="numero">3</div>
    <div class="numero">4</div>
    <div class="numero">5</div>

    <div class="numero">6</div>
    <div class="numero">7</div>
    <div class="numero">8</div>
    <div class="numero">9</div>
    <div class="numero">0</div>
  </div>

  <div class="simbolo">☥</div>

  <div id="planchette"></div>

</div>

<div id="controles">

  <input
    id="pregunta"
    type="text"
    placeholder="Haz tu pregunta a la Ouija..."
  >

  <button id="consultar">
    CONSULTAR
  </button>

</div>

<div id="respuesta"></div>


<script>

const tablero = document.getElementById("tablero");
const planchette = document.getElementById("planchette");
const pregunta = document.getElementById("pregunta");
const consultar = document.getElementById("consultar");
const respuesta = document.getElementById("respuesta");


const respuestas = [

  "SÍ",

  "NO",

  "QUIZÁ",

  "PREGUNTA DE NUEVO",

  "NO HAY RESPUESTA",

  "LAS FUERZAS DICEN QUE SÍ",

  "LAS FUERZAS DICEN QUE NO",

  "MÁS TARDE",

  "EL DESTINO ES INCIERTO",

  "SÍ, PERO TEN CUIDADO",

  "NO PARECE PROBABLE",

  "TODO APUNTA A QUE SÍ",

  "TODO APUNTA A QUE NO"

];


function moverPlanchette() {

  const ancho = tablero.clientWidth;
  const alto = tablero.clientHeight;

  const x =
    15 +
    Math.random() * (ancho - 30);

  const y =
    15 +
    Math.random() * (alto - 30);

  planchette.style.left = x + "px";
  planchette.style.top = y + "px";

}


function obtenerRespuesta() {

  const indice =
    Math.floor(
      Math.random() * respuestas.length
    );

  return respuestas[indice];

}


consultar.addEventListener("click", () => {

  if (!pregunta.value.trim()) {

    respuesta.textContent =
      "Primero haz una pregunta...";

    respuesta.classList.add("visible");

    return;
  }


  consultar.disabled = true;

  respuesta.classList.remove("visible");

  respuesta.textContent =
    "La planchette está buscando una respuesta...";


  let movimientos = 0;

  const intervalo = setInterval(() => {

    moverPlanchette();

    movimientos++;

    if (movimientos >= 6) {

      clearInterval(intervalo);

      setTimeout(() => {

        respuesta.textContent =
          "✦ " + obtenerRespuesta() + " ✦";

        respuesta.classList.add("visible");

        consultar.disabled = false;

      }, 1000);

    }

  }, 900);

});


pregunta.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {

    event.preventDefault();

    consultar.click();

  }

});


</script>

</body>
</html>
