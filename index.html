<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Terror - Dark & Bloody</title>
  
  <!-- Tipografías Cuadradas y Angulares -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,700;1,900&family=Metal+Mania&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #050202;
      --card-bg: rgba(12, 5, 5, 0.95);
      --blood-red: #7a0000;
      --bright-blood: #b80000;
      --gore-glow: #ff0000;
      --text-gray: #aaaaaa;
      --border-color: rgba(184, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      /* Fondo con grano y viñeta */
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(120, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.95) 85%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 1px, transparent 1px, transparent 2px);
    }

    /* --- NAVEGACIÓN --- */
    .navbar {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--blood-red);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-family: 'Metal Mania', cursive;
      font-size: 1.8rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--gore-glow);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-gray);
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--gore-glow);
    }

    /* --- ESTILO DE BOTONES SANGRIENTOS --- */
    .bloody-btn {
      position: relative;
      background: #080808;
      color: #e0e0e0;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 16px 32px;
      border: 2px solid var(--blood-red);
      cursor: pointer;
      outline: none;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      transition: color 0.3s, border-color 0.3s;
      border-radius: 0; /* Formato rigurosamente cuadrado */
    }

    .bloody-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: var(--bright-blood);
      z-index: 0;
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Derramamiento de sangre al pasar el cursor */
    .bloody-btn::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 0;
      background: var(--bright-blood);
      clip-path: polygon(
        0% 0%, 100% 0%, 
        95% 80%, 88% 30%, 80% 100%, 
        70% 20%, 60% 90%, 50% 10%, 
        40% 85%, 30% 25%, 20% 95%, 
        10% 20%, 0% 75%
      );
      opacity: 0;
      transition: height 0.4s ease-in-out, opacity 0.3s ease-in-out;
      pointer-events: none;
      z-index: 2;
    }

    .bloody-btn span {
      position: relative;
      z-index: 1;
    }

    .bloody-btn:hover {
      color: #000;
      border-color: var(--gore-glow);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
    }

    .bloody-btn:hover::before {
      height: 100%;
    }

    .bloody-btn:hover::after {
      height: 26px;
      opacity: 1;
      transform: translateY(100%);
    }

    /* --- HERO SECTION --- */
    .hero {
      padding: 80px 20px;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .main-title {
      font-family: 'Metal Mania', cursive;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow: 0 0 15px var(--gore-glow), 4px 5px 0px var(--blood-red);
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: var(--text-gray);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .cta-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    /* --- SECCIÓN DE CONTENIDO PRINCIPAL --- */
    .main-content {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
    }

    .section-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      border-left: 5px solid var(--bright-blood);
      padding-left: 15px;
      margin-bottom: 30px;
      color: #fff;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    /* Tarjetas de Contenido Angulares */
    .horror-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      position: relative;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
      transition: border-color 0.3s, transform 0.3s;
    }

    .horror-box:hover {
      border-color: var(--gore-glow);
      transform: translateY(-5px);
    }

    .horror-box h3 {
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .horror-box p {
      color: #888;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    /* --- FOOTER --- */
    footer {
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 30px;
      color: #555;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-top: 60px;
    }

    /* --- RESPONSIVIDAD (MÓVILES) --- */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 15px;
        padding: 15px 20px;
      }

      .cta-container {
        flex-direction: column;
        width: 100%;
      }

      .bloody-btn {
        width: 100%;
      }

      .horror-box {
        clip-path: none; /* Mejor rendimiento visual en pantallas pequeñas */
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar">
    <div class="brand-logo"></div>
    <ul class="nav-links">
      <li><a href="#archivo">Archiv</a></li>
      <li><a href="#camaras"></a></li>
      <li><a href="#protocolo">Protocolo</a></li>
    </ul>
  </nav>

  <!-- SECCIÓN PRINCIPAL -->
  <header class="hero">
    <h1 class="main-title">!</h1>
    <p class="hero-subtitle">! //</p>
    
    <!-- ACCIONES DE NAVEGACIÓN FUNCIONALES -->
    <div class="cta-container">
      <!-- Opción A: Enlaces directos a otras URLs o secciones -->
      <a href="https://google.com" target="_blank" class="bloody-btn">
        <span>INICIAR SESIÓN</span>
      </a>
      
      <!-- Opción B: Ejecución por JavaScript -->
      <button class="bloody-btn" id="btn-escapar">
        <span>CERRAR CONEXIÓN</span>
      </button>
    </div>
  </header>

  <!-- SECCIÓN DE CONTENIDO DE LA PÁGINA -->
  <main class="main-content">
    <h2 class="section-title">REGISTROS DISPONIBLES</h2>

    <div class="grid-container">
      <article class="horror-box">
        <h3>REGISTRO #091</h3>
        <p>.</p>
      </article>

      <article class="horror-box">
        <h3></h3>
        <p></p>
      </article>

      <article class="horror-box">
        <h3></h3>
        <p>.</p>
      </article>
    </div>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>&copy; 2026 TERMINAL DE ACCESO DIRECTO. TODOS LOS DERECHOS INFECTADOS.</p>
  </footer>

  <!-- SCRIPT PARA MANEJO DE ACCIONES EN BOTONES -->
  <script>
    // Evento funcional para el botón de "CERRAR CONEXIÓN"
    document.getElementById('btn-escapar').addEventListener('click', () => {
      const confirmar = confirm('¿Estás seguro de que quieres cerrar la conexión antes de que sea tarde?');
      if (confirmar) {
        window.location.href = 'about:blank'; // Redirige a página en blanco
      }
    });
  </script>

</body>
</html>
