<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horror UI - Dark & Bloody</title>
  
  <!-- Tipografías Cuadradas y Angulares -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=Metal+Mania&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #030303;
      --card-bg: rgba(10, 4, 4, 0.92);
      --blood-red: #800000;
      --bright-blood: #b80000;
      --gore-glow: #ff0000;
      --text-gray: #b0b0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Textura de viñeta oscura con grano */
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(128, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.98) 85%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 1px, transparent 1px, transparent 2px);
      overflow-x: hidden;
    }

    /* Tarjeta principal con recortes angulares */
    .horror-card {
      max-width: 750px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--blood-red);
      box-shadow: 0 0 30px rgba(128, 0, 0, 0.35), inset 0 0 20px rgba(0, 0, 0, 0.95);
      padding: clamp(20px, 5vw, 50px);
      text-align: center;
      position: relative;
      /* Esquinas cortadas (estilo industrial/afilado) */
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    }

    /* Título principal agudo y gótico */
    .title {
      font-family: 'Metal Mania', 'Chakra Petch', cursive;
      font-size: clamp(2.2rem, 6vw, 4.2rem);
      color: #f0f0f0;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 
        0 0 12px var(--gore-glow),
        3px 4px 0px var(--blood-red);
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(128, 0, 0, 0.5);
      padding-bottom: 15px;
    }

    .content {
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      line-height: 1.6;
      color: #888;
      margin-bottom: 40px;
      font-weight: 700;
    }

    /* Contenedor de Botones */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    /* Botón Sangriento */
    .bloody-btn {
      position: relative;
      background: #080808;
      color: #e0e0e0;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 18px 36px;
      border: 2px solid var(--blood-red);
      cursor: pointer;
      outline: none;
      transition: color 0.3s, border-color 0.3s;
      border-radius: 0; /* Forma estrictamente cuadrada */
    }

    /* Capa de llenado de sangre */
    .bloody-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: var(--bright-blood);
      z-index: 0;
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Gotas de sangre derramadas abajo (Clip-Path Visceral) */
    .bloody-btn::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 0;
      background: var(--bright-blood);
      /* Renderizado de picos/chorros de sangre derramada */
      clip-path: polygon(
        0% 0%, 100% 0%, 
        95% 80%, 88% 30%, 80% 100%, 
        70% 20%, 60% 90%, 50% 10%, 
        40% 85%, 30% 25%, 20% 95%, 
        10% 20%, 0% 75%
      );
      opacity: 0;
      transition: height 0.4s ease-in-out, opacity 0.3s ease-in-out;
      pointer-events: none;
      z-index: 2;
    }

    .bloody-btn span {
      position: relative;
      z-index: 1;
      transition: text-shadow 0.3s;
    }

    /* HOVER: EFECTO SANGRIENTO */
    .bloody-btn:hover {
      color: #000;
      border-color: var(--gore-glow);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
    }

    .bloody-btn:hover::before {
      height: 100%;
    }

    /* Se activa el derramamiento inferior */
    .bloody-btn:hover::after {
      height: 28px;
      opacity: 1;
      transform: translateY(100%);
    }

    .bloody-btn:hover span {
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
    }

    /* RESPONSIVO (Móviles y Tabletas) */
    @media (max-width: 600px) {
      .horror-card {
        clip-path: none; /* Mejor renderizado en pantallas pequeñas */
        border-radius: 0;
      }

      .btn-container {
        flex-direction: column;
        width: 100%;
      }

      .bloody-btn {
        width: 100%;
        padding: 16px 20px;
      }

      .bloody-btn:hover::after {
        height: 22px; /* Reducción ligera para móvil */
      }
    }
  </style>
</head>
<body>

  <main class="horror-card">
    <h1 class="title">NO HAY SALIDA</h1>
    <p class="subtitle">SISTEMA INFECTADO // PROTOCOLO DE TERROR</p>
    
    <p class="content">
      El aire se vuelve pesado y el silencio consume todo a tu alrededor.
      Pasa el cursor sobre la elección antes de que sea demasiado tarde.
    </p>

    <div class="btn-container">
      <button class="bloody-btn">
        <span>ENTRAR</span>
      </button>
      <button class="bloody-btn">
        <span>ESCAPAR</span>
      </button>
    </div>
  </main>

</body>
</html>
